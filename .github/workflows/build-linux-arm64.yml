name: build linux arm64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "megcfbt/**"
      - "renframe/**"
      - "rpgmframe/**"
      - "gamemakerframe/**"
      - "loveframe/**"
      - "constructframe/**"
      - "agsframe/**"
      - "monoframe/**"
      - "unityframe/**"
      - "celesteframe/**"
      - "build/build_linux_aarch64.sh"
      - "build/release_metadata.py"
      - "build/build_identity.py"
      - "build/verify_build_identity.py"
      - "setup.py"
      - "docs/releases/**"
      - "experiments/sts2-steamworks/**"
      - "pyproject.toml"
      - ".github/workflows/build-linux-arm64.yml"
  push:
    branches: [integration/working-main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Build native AArch64 app
        run: |
          python -m pip install --upgrade pip
          bash build/build_linux_aarch64.sh

      - name: Run native ARM64 regression tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Smoke-check binary architecture
        run: |
          APP="dist/linux-aarch64/Multi-Engine Game Conversion Framework by tovakai/Multi-Engine Game Conversion Framework by tovakai"
          test -x "$APP"
          file "$APP"
          file "$APP" | grep -Eq 'ARM aarch64|ARM64|aarch64'
          xvfb-run -a "$APP" --verify-gui-startup --receipt build/frozen-gui-startup.json
          python build/verify_build_identity.py --application "dist/linux-aarch64/Multi-Engine Game Conversion Framework by tovakai" --receipt build/frozen-gui-startup.json --platform linux-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: multi-engine-game-conversion-framework-by-tovakai-linux-aarch64
          path: |
            dist/*-linux-aarch64.tar.gz
            dist/SHA256SUMS-linux-aarch64.txt
            build/frozen-gui-startup.json
          if-no-files-found: error
