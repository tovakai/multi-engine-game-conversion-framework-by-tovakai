name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q megcfbt renframe rpgmframe
      - run: pytest -q
      - name: STS2 standalone and native-build regression tests
        run: python -m unittest discover -s experiments/sts2-steamworks -p 'test_*.py'
