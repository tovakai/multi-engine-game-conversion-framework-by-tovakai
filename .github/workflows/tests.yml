name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Use Git Bash for Windows launcher tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\bin" >> $env:GITHUB_PATH'
      - run: python -m compileall -q megcfbt renframe rpgmframe gamemakerframe loveframe constructframe agsframe monoframe unityframe
      - run: pytest -q
