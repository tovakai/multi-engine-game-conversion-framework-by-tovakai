name: build windows x64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "megcfbt/**"
      - "renframe/**"
      - "rpgmframe/**"
      - "gamemakerframe/**"
      - "loveframe/**"
      - "constructframe/**"
      - "agsframe/**"
      - "monoframe/**"
      - "unityframe/**"
      - "celesteframe/**"
      - "experiments/sts2-steamworks/**"
      - "build/build_windows.ps1"
      - "build/release_metadata.py"
      - "build/build_identity.py"
      - "build/verify_build_identity.py"
      - "setup.py"
      - "docs/releases/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [integration/working-main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows GUI
        shell: pwsh
        run: ./build/build_windows.ps1
      - name: Check frozen GUI startup
        shell: pwsh
        run: |
          $exe = "dist/windows/Multi-Engine Game Conversion Framework by tovakai/Multi-Engine Game Conversion Framework by tovakai.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @('--verify-gui-startup', '--receipt', 'build/frozen-gui-startup.json') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen GUI startup failed" }
          $receipt = Get-Content build/frozen-gui-startup.json -Raw | ConvertFrom-Json
          if ($receipt.state -ne 'complete' -or -not $receipt.frozen) { throw "Invalid startup receipt" }
          python build/verify_build_identity.py --application "dist/windows/Multi-Engine Game Conversion Framework by tovakai" --receipt build/frozen-gui-startup.json --platform windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Frozen build identity verification failed" }
      - name: Check frozen GUI with long font paths
        shell: pwsh
        run: |
          $appName = "Multi-Engine Game Conversion Framework by tovakai"
          $source = Join-Path (Get-Location) "dist/windows/$appName"
          $fontRelative = "$appName/_internal/customtkinter/assets/fonts/CustomTkinter_shapes_font.otf"
          $base = Join-Path (Get-Location) "build/gui-long-path-"
          $padding = [Math]::Max(1, 270 - (Join-Path $base $fontRelative).Length)
          $destination = $base + ("x" * $padding)
          New-Item -ItemType Directory -Path $destination | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Recurse
          $app = Join-Path $destination $appName
          $font = Join-Path $app "_internal/customtkinter/assets/fonts/CustomTkinter_shapes_font.otf"
          if ($font.Length -le 260 -or -not (Test-Path -LiteralPath $font)) { throw "Long-path font fixture missing" }
          $receipt = Join-Path (Get-Location) "build/frozen-gui-long-path.json"
          $process = Start-Process -FilePath (Join-Path $app "$appName.exe") -ArgumentList @('--verify-gui-startup', '--receipt', $receipt) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Long-path GUI startup timed out" }
          if ($process.ExitCode -ne 0) { throw "Long-path GUI startup failed: $($process.ExitCode)" }
          python build/verify_build_identity.py --application $app --receipt $receipt --platform windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Long-path frozen identity validation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: multi-engine-game-conversion-framework-by-tovakai-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/SHA256SUMS-windows-x64.txt
            build/frozen-gui-startup.json
            build/frozen-gui-long-path.json
          if-no-files-found: error
