[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-engine-game-conversion-framework-by-tovakai"
version = "0.1.0"
description = "Multi-engine game runtime conversion tooling for Linux ARM64."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Tovakai" }]
keywords = ["renpy", "rpg-maker", "godot", "arm64", "linux", "steam-frame"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["customtkinter>=5.2.2", "tkinterdnd2>=0.4.2"]
build = ["pyinstaller>=6.3.0"]

[project.scripts]
multi-engine-game-conversion-framework-by-tovakai = "megcfbt.cli:main"
multi-engine-game-conversion-framework-by-tovakai-gui = "megcfbt.gui:main"
renframe = "renframe.cli:main"
rpgmframe = "rpgmframe.cli:main"

[tool.setuptools.packages.find]
include = ["megcfbt*", "renframe*", "rpgmframe*"]

[tool.setuptools.data-files]
"share/megcfbt/sts2" = [
    "experiments/sts2-steamworks/convert_sts2.py",
    "experiments/sts2-steamworks/converter_io.py",
    "experiments/sts2-steamworks/converter_profile_v1.json",
    "experiments/sts2-steamworks/fetch_converter_runtimes.py",
    "experiments/sts2-steamworks/verify_output.py",
    "experiments/sts2-steamworks/prepare_managed.py",
    "experiments/sts2-steamworks/patch_accessors.py",
    "experiments/sts2-steamworks/patch_stats.py",
    "experiments/sts2-steamworks/patch_pack.py",
    "experiments/sts2-steamworks/adapt_packed_manifests.py",
    "experiments/sts2-steamworks/adapt_deployment_graph.py",
    "experiments/sts2-steamworks/inspect_dependency_graph.py",
    "experiments/sts2-steamworks/inventory_package.py",
    "experiments/sts2-steamworks/pipeline.py",
    "experiments/sts2-steamworks/preflight.py",
    "experiments/sts2-steamworks/build_native.py",
    "experiments/sts2-steamworks/adapt_fmod_build_sources.py",
    "experiments/sts2-steamworks/fmod_sdk_observation_v1.json",
    "experiments/sts2-steamworks/sdk_archive.py",
    "LICENSE",
]
"share/megcfbt/sts2/licenses" = ["experiments/sts2-steamworks/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
